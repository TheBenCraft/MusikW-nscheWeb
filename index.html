<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff5d8f'/%3E%3Cellipse cx='38' cy='70' rx='15' ry='11' fill='%2314102b'/%3E%3Crect x='48' y='24' width='7' height='46' fill='%2314102b'/%3E%3Cpath d='M55 24q22 4 22 24-8-12-22-12z' fill='%2314102b'/%3E%3C/svg%3E">
<title>Musikwunsch</title>
<style>
:root{--bg:#14102b;--panel:#201a45;--text:#f3eefc;--muted:#a79fd0;--pink:#ff5d8f;--yellow:#ffd447;--line:#3a3270}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px}
h1{font-size:clamp(2.4rem,11vw,3.6rem);line-height:.95;margin:.2em 0 .3em;font-weight:800;letter-spacing:-.02em}
h1 span{display:inline-block;background:var(--pink);color:var(--bg);padding:0 .15em;transform:rotate(-2deg)}
p{color:var(--muted);line-height:1.5;margin:0 0 1.4em}
label{display:block;font-weight:700;margin:1em 0 .35em}
input{width:100%;font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:.75em .9em}
input:focus{outline:3px solid var(--yellow);outline-offset:1px;border-color:var(--yellow)}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:10px;padding:.8em 1.2em;background:var(--yellow);color:var(--bg)}
button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
button.main{width:100%;margin-top:1.4em;font-size:1.1rem}
button.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);padding:.4em .8em;font-weight:700}
.msg{min-height:1.5em;margin-top:1em;font-weight:700}
.ok{color:var(--yellow)}.err{color:var(--pink)}
.hide{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:1em;color:var(--muted)}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
li{background:var(--panel);border-left:6px solid var(--pink);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
li.done{opacity:.45;border-left-color:var(--line)}
li.done .t{text-decoration:line-through}
.t{font-weight:800;font-size:1.1rem;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:.9rem}
li.dup{border-left-color:var(--yellow)}
.badge{display:inline-block;margin-left:.5em;padding:.05em .55em;border-radius:99px;background:var(--yellow);color:var(--bg);font-size:.8rem;font-weight:800;white-space:nowrap}
.act{display:flex;gap:6px;flex-shrink:0}
.bar{flex-wrap:wrap}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:240px;display:grid;gap:2px;padding:6px;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu.hide{display:none}
.menu button{background:transparent;color:var(--text);text-align:left;width:100%;border-radius:8px}
.menu button:hover,.menu button:focus-visible{background:var(--line)}
.menu button.paused{color:var(--pink)}
.chip{display:inline-block;margin:0 6px 10px 0;padding:.1em .7em;border-radius:99px;font-size:.85rem;font-weight:800;background:var(--pink);color:var(--bg)}
.chip.y{background:var(--yellow)}
li{flex-wrap:wrap}
li > div:first-child{flex:1 1 200px}
#panel button{min-height:44px;padding:.6em 1em}
#panel .t{font-size:1.25rem}
#flash{position:fixed;inset:0;pointer-events:none;background:var(--yellow);opacity:0;z-index:50}
@keyframes pulse{0%,100%{opacity:0}35%{opacity:.18}}
.menu button.danger{color:var(--pink)}
input[type=checkbox]{width:auto;margin:0}
label.chk{display:flex;align-items:center;gap:.6em;font-weight:400;margin:1em 0 0}
dialog{background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:20px;width:min(92vw,420px);font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{margin:0 0 .4em}
dialog p{margin:0 0 .5em}
.wbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:1em}
button.solid{background:var(--pink);color:var(--bg)}
#search{margin-bottom:12px}
#stats{width:min(94vw,560px);max-height:88vh;overflow:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:1em 0}
.card{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:1.3rem;font-weight:800;overflow-wrap:anywhere}
.card span{color:var(--muted);font-size:.85rem}
.hrow{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:4px 0;font-size:.9rem}
.htrack{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}
.hfill{height:100%;background:var(--yellow)}
.hfill.max{background:var(--pink)}
.hn{text-align:right;font-weight:800}
dialog h3{margin:1.2em 0 .4em;font-size:1rem}
dialog ol{margin:0;padding-left:1.6em}
dialog li{display:list-item;background:none;border:0;border-radius:0;padding:2px 0;opacity:1}
footer{margin-top:2.5em;font-size:.85rem;color:var(--muted)}
footer a{color:var(--muted)}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--yellow)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:no-preference){#flash.on{animation:pulse .9s ease-in-out 2}li.new{animation:flash 3s ease-out}h1 span{transition:transform .3s}h1:hover span{transform:rotate(2deg)}}
</style>
</head>
<body>
<main>

<section id="guest">
  <h1>Was soll <span>laufen?</span></h1>
  <p>Schreib deinen Musikwunsch auf. Der DJ sieht ihn sofort.</p>
  <div>
    <label for="song">Titel</label>
    <input id="song" maxlength="200" autocomplete="off">
    <label for="artist">Interpret</label>
    <input id="artist" maxlength="200" autocomplete="off">
    <label for="name">Dein Name (optional)</label>
    <input id="name" maxlength="60" autocomplete="off">
    <button class="main" id="send">Wunsch abschicken</button>
    <div class="msg" id="gmsg" role="status"></div>
  </div>
</section>

<section id="admin" class="hide">
  <h1>Wunsch<span>liste</span></h1>
  <div id="login">
    <label for="mail">E-Mail</label>
    <input id="mail" type="email" autocomplete="username">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="main" id="go">Anmelden</button>
    <div class="msg err" id="lmsg" role="status"></div>
  </div>
  <div id="panel" class="hide">
    <div class="bar"><span id="count"></span>
      <div class="menuwrap">
        <button class="ghost" id="menuBtn" aria-haspopup="true" aria-expanded="false">Menü ☰</button>
        <div class="menu hide" id="menu" role="menu">
          <button role="menuitem" id="open">Wünsche pausieren</button>
          <button role="menuitem" id="spam">Spam-Schutz ausschalten</button>
          <button role="menuitem" id="snd">Ton: an</button>
          <button role="menuitem" id="hide" aria-pressed="false">Gespielte ausblenden</button>
          <button role="menuitem" id="statsBtn">Statistik</button>
          <button role="menuitem" id="csv">Excel-Export</button>
          <button role="menuitem" id="reload">Aktualisieren</button>
          <button role="menuitem" id="wipeBtn" class="danger">Alle Wünsche löschen …</button>
          <button role="menuitem" id="out">Abmelden</button>
        </div>
      </div>
    </div>
    <div id="status"></div>
    <input id="search" type="search" placeholder="Suchen nach Titel, Interpret oder Name" aria-label="Wunschliste durchsuchen" autocomplete="off">
    <ul id="list"></ul>
  </div>
</section>

<footer><a href="impressum.html">Impressum</a> &nbsp; <a href="datenschutz.html">Datenschutz</a></footer>
</main>
<dialog id="wipe" aria-labelledby="wt">
  <h2 id="wt">Alle Wünsche löschen?</h2>
  <p>Damit werden alle Wünsche endgültig entfernt. Das lässt sich nicht rückgängig machen.</p>
  <label class="chk"><input type="checkbox" id="wbackup" checked> Vorher als Excel-Datei sichern</label>
  <label for="wpw">Passwort zur Bestätigung</label>
  <input id="wpw" type="password" autocomplete="current-password">
  <div class="msg err" id="wmsg" role="status"></div>
  <div class="wbtns"><button class="ghost" id="wcancel">Abbrechen</button><button class="solid" id="wgo">Endgültig löschen</button></div>
</dialog>
<dialog id="stats" aria-labelledby="st">
  <h2 id="st">Statistik</h2>
  <div id="statsBody"></div>
  <div class="wbtns"><button class="ghost" id="sclose">Schließen</button><button id="sexp">Als Excel-Datei speichern</button></div>
</dialog>
<div id="flash"></div>
<script>
// ===== Hier eintragen (Supabase: Project Settings > API) =====
const SUPABASE_URL = "https://yrewxcoulmmobpdjmzxb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyZXd4Y291bG1tb2JwZGptenhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDI2ODIsImV4cCI6MjEwODg3ODY4Mn0.ofJbAC4mw9gyxMWq5exFtkcXGtMCTRr1ByHNn_VbjOU";
// =============================================================

const $ = id => document.getElementById(id);
const base = SUPABASE_URL + "/rest/v1/wishes";
const hdr = tok => ({apikey: SUPABASE_KEY, Authorization: "Bearer " + (tok || SUPABASE_KEY), "Content-Type": "application/json"});
let token = null, timer = null, lastRows = [], hideDone = false;
let adminMail = "", knownIds = null, soundOn = true, audioCtx = null, wakeLock = null, isOpen = true, spamOn = true;

function route(){
  const isAdmin = location.hash === "#admin";
  $("guest").classList.toggle("hide", isAdmin);
  $("admin").classList.toggle("hide", !isAdmin);
}
addEventListener("hashchange", route); route();

// ---- Gäste ----
const COOLDOWN = 120; // Sekunden zwischen zwei Wünschen pro Gerät
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
function closedUI(){
  ["song","artist","name","send"].forEach(id => $(id).disabled = true);
  $("gmsg").className = "msg err"; $("gmsg").textContent = "Wünsche sind gerade pausiert.";
}
async function checkOpen(){
  try{
    const r = await fetch(SUPABASE_URL + "/rest/v1/settings?select=*&id=eq.1", {headers: hdr()});
    const j = await r.json();
    if(j[0]){ spamOn = j[0].spam_schutz !== false; if(j[0].open === false){ closedUI(); return false; } }
  }catch(e){}
  return true;
}
checkOpen();
$("send").onclick = async () => {
  const song = $("song").value.trim(), artist = $("artist").value.trim(), name = $("name").value.trim();
  const m = $("gmsg");
  if(!song){ m.className = "msg err"; m.textContent = "Bitte gib einen Titel ein."; return; }
  $("send").disabled = true;
  try{
    if(!(await checkOpen())) return; // holt auch den aktuellen Stand des Spam-Schutzes
    const wait = Math.ceil(COOLDOWN - (Date.now() - Number(store.get("lastWish") || 0)) / 1000);
    if(spamOn && wait > 0){
      m.className = "msg err"; m.textContent = "Bitte warte noch " + wait + " Sekunden, bevor du den nächsten Wunsch abschickst.";
      $("send").disabled = false; return;
    }
    const r = await fetch(base, {method:"POST", headers:{...hdr(), Prefer:"return=minimal"}, body: JSON.stringify({song, artist: artist || null, name: name || null})});
    if(!r.ok){ if(!(await checkOpen())) return; throw 0; }
    store.set("lastWish", Date.now());
    $("song").value = $("artist").value = "";
    m.className = "msg ok"; m.textContent = "Wunsch ist angekommen. Danke!";
  }catch(e){ m.className = "msg err"; m.textContent = "Das hat nicht geklappt. Versuch es gleich noch einmal."; }
  $("send").disabled = false;
};

// ---- Admin ----
$("go").onclick = async () => {
  $("lmsg").textContent = "";
  try{
    const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {method:"POST", headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"}, body: JSON.stringify({email:$("mail").value.trim(), password:$("pw").value})});
    if(!r.ok) throw 0;
    token = (await r.json()).access_token;
    adminMail = $("mail").value.trim();
    $("pw").value = "";
    $("login").classList.add("hide"); $("panel").classList.remove("hide");
    try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    requestWake(); load(); timer = setInterval(load, 8000);
  }catch(e){ $("lmsg").textContent = "Anmeldung fehlgeschlagen. Prüfe E-Mail und Passwort."; }
};
$("out").onclick = () => { token = null; clearInterval(timer); knownIds = null; $("search").value = ""; try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; $("panel").classList.add("hide"); $("login").classList.remove("hide"); $("list").textContent = ""; };
$("reload").onclick = () => load();
$("hide").onclick = () => {
  hideDone = !hideDone;
  $("hide").textContent = hideDone ? "Gespielte einblenden" : "Gespielte ausblenden";
  $("hide").setAttribute("aria-pressed", hideDone);
  load();
};

function csvSafe(v){ v = v == null ? "" : String(v); if(/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
function downloadCsv(filename, rows){
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(csvSafe).join(";")).join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.append(a); a.click(); a.remove();
}
$("csv").onclick = () => downloadCsv("musikwuensche.csv", [["Zeit","Titel","Interpret","Gespielt"], ...lastRows.map(w => [new Date(w.created_at).toLocaleString("de-DE"), w.song, w.artist, w.done ? "ja" : "nein"])]);

function blink(){
  const f = $("flash");
  f.classList.remove("on"); void f.offsetWidth; f.classList.add("on");
}
function beep(){
  if(!soundOn || !audioCtx) return;
  try{
    if(audioCtx.state === "suspended") audioCtx.resume();
    [880, 1175].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * .18;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.25, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      o.start(t); o.stop(t + .17);
    });
  }catch(e){}
}
$("snd").onclick = () => { soundOn = !soundOn; $("snd").textContent = "Ton: " + (soundOn ? "an" : "aus"); if(soundOn) beep(); };

function updateOpenBtn(){
  $("open").textContent = isOpen ? "Wünsche pausieren" : "Wünsche wieder annehmen";
  $("open").classList.toggle("paused", !isOpen);
  $("spam").textContent = spamOn ? "Spam-Schutz ausschalten" : "Spam-Schutz einschalten";
  $("spam").classList.toggle("paused", !spamOn);
  const st = $("status"); st.textContent = "";
  const chip = (t, y) => { const c = document.createElement("span"); c.className = "chip" + (y ? " y" : ""); c.textContent = t; st.append(c); };
  if(!isOpen) chip("Wünsche pausiert");
  if(!spamOn) chip("Spam-Schutz aus", true);
}
$("spam").onclick = async () => {
  await fetch(SUPABASE_URL + "/rest/v1/settings?id=eq.1", {method:"PATCH", headers: hdr(token), body: JSON.stringify({spam_schutz: !spamOn})});
  load();
};
$("wipeBtn").onclick = () => { $("wpw").value = ""; $("wmsg").textContent = ""; $("wipe").showModal(); $("wpw").focus(); };
$("wcancel").onclick = () => $("wipe").close();
$("wpw").addEventListener("keydown", e => { if(e.key === "Enter") $("wgo").click(); });
$("wgo").onclick = async () => {
  const pw = $("wpw").value;
  if(!pw){ $("wmsg").textContent = "Bitte gib dein Passwort ein."; return; }
  $("wgo").disabled = true; $("wmsg").textContent = "";
  try{
    const a = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {method:"POST", headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"}, body: JSON.stringify({email: adminMail, password: pw})});
    if(!a.ok){ $("wmsg").textContent = "Das Passwort ist falsch."; return; }
    if($("wbackup").checked && lastRows.length) $("csv").onclick();
    const d = await fetch(base + "?id=gte.0", {method:"DELETE", headers: hdr(token)});
    if(!d.ok) throw 0;
    $("wipe").close(); load();
  }catch(e){ $("wmsg").textContent = "Das hat nicht geklappt. Versuch es noch einmal."; }
  finally{ $("wgo").disabled = false; $("wpw").value = ""; }
};
const normText = t => (t || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
function computeStats(rows){
  if(!rows.length) return {total: 0};
  const times = rows.map(w => new Date(w.created_at));
  const first = new Date(Math.min(...times)), last = new Date(Math.max(...times));
  const hourStart = d => { const x = new Date(d); x.setMinutes(0, 0, 0); return x; };
  const t0 = hourStart(first).getTime(), slots = [];
  for(let t = t0; t <= last.getTime(); t += 3600000) slots.push({start: new Date(t), count: 0});
  times.forEach(d => { const i = Math.floor((hourStart(d).getTime() - t0) / 3600000); if(slots[i]) slots[i].count++; });
  const multi = first.toDateString() !== last.toDateString();
  const pad = n => String(n).padStart(2, "0");
  slots.forEach(sl => {
    const h = sl.start.getHours();
    sl.label = (multi ? sl.start.toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit"}) + " " : "") + pad(h) + ":00–" + pad((h + 1) % 24) + ":00";
  });
  const songs = new Map();
  rows.forEach(w => {
    const k = normText(w.song) + "|" + normText(w.artist);
    if(!songs.has(k)) songs.set(k, {song: w.song, artist: w.artist || "", count: 0});
    songs.get(k).count++;
  });
  const top = [...songs.values()].sort((x, y) => y.count - x.count || x.song.localeCompare(y.song, "de")).slice(0, 10);
  const max = Math.max(...slots.map(x => x.count)), min = Math.min(...slots.map(x => x.count));
  return {total: rows.length, songs: songs.size, first, last, slots, top, max, min,
          busiest: slots.filter(x => x.count === max), quietest: slots.filter(x => x.count === min)};
}
const fmtSlots = a => a.slice(0, 3).map(x => x.label).join(", ") + (a.length > 3 ? " …" : "");
function renderStats(){
  const st = computeStats(lastRows), body = $("statsBody");
  body.textContent = "";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
  if(!st.total){ body.append(el("p", "", "Noch keine Wünsche.")); $("sexp").disabled = true; return; }
  $("sexp").disabled = false;
  const cards = el("div", "cards");
  const card = (big, small) => { const c = el("div", "card"); c.append(el("b", "", big), el("span", "", small)); cards.append(c); };
  card(String(st.total), "Wünsche gesamt");
  card(String(st.songs), "verschiedene Lieder");
  card(fmtSlots(st.busiest) + " Uhr", "stärkste Zeit, " + st.max + " Wünsche");
  if(st.slots.length > 1) card(fmtSlots(st.quietest) + " Uhr", "ruhigste Zeit, " + st.min + " Wünsche");
  body.append(cards, el("h3", "", "Wünsche pro Stunde"));
  st.slots.forEach(x => {
    const row = el("div", "hrow"), track = el("div", "htrack"), fill = el("div", "hfill" + (x.count === st.max ? " max" : ""));
    fill.style.width = (st.max ? x.count / st.max * 100 : 0) + "%";
    track.append(fill); row.append(el("span", "", x.label), track, el("span", "hn", String(x.count))); body.append(row);
  });
  body.append(el("h3", "", "Meistgewünschte Lieder"));
  const ol = el("ol");
  st.top.forEach(x => ol.append(el("li", "", x.song + (x.artist ? " – " + x.artist : "") + " (" + x.count + "×)")));
  body.append(ol);
}
$("statsBtn").onclick = () => { renderStats(); $("stats").showModal(); };
$("sclose").onclick = () => $("stats").close();
$("sexp").onclick = () => {
  const st = computeStats(lastRows); if(!st.total) return;
  downloadCsv("statistik.csv", [
    ["Wünsche gesamt", st.total], ["Verschiedene Lieder", st.songs],
    ["Erster Wunsch", st.first.toLocaleString("de-DE")], ["Letzter Wunsch", st.last.toLocaleString("de-DE")],
    [], ["Uhrzeit", "Wünsche"], ...st.slots.map(x => [x.label, x.count]),
    [], ["Titel", "Interpret", "Anzahl"], ...st.top.map(x => [x.song, x.artist, x.count])
  ]);
};
let searchTimer;
$("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(load, 250); });
function closeMenu(){ $("menu").classList.add("hide"); $("menuBtn").setAttribute("aria-expanded", "false"); }
$("menuBtn").onclick = e => {
  e.stopPropagation();
  const open = $("menu").classList.toggle("hide") === false;
  $("menuBtn").setAttribute("aria-expanded", open);
};
$("menu").addEventListener("click", e => { if(e.target.closest("button")) closeMenu(); });
document.addEventListener("click", e => { if(!e.target.closest(".menuwrap")) closeMenu(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeMenu(); });
$("open").onclick = async () => {
  await fetch(SUPABASE_URL + "/rest/v1/settings?id=eq.1", {method:"PATCH", headers: hdr(token), body: JSON.stringify({open: !isOpen})});
  load();
};

async function requestWake(){
  try{
    if(token && "wakeLock" in navigator && !(wakeLock && !wakeLock.released)) wakeLock = await navigator.wakeLock.request("screen");
  }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(!document.hidden){ document.title = "Musikwunsch"; requestWake(); } });

async function load(){
  const r = await fetch(base + "?select=*&order=created_at.desc", {headers: hdr(token)});
  if(!r.ok){ $("out").onclick(); $("lmsg").textContent = "Sitzung abgelaufen. Bitte neu anmelden."; return; }
  const rows = await r.json();
  lastRows = rows;
  try{
    const sr = await fetch(SUPABASE_URL + "/rest/v1/settings?select=*&id=eq.1", {headers: hdr(token)});
    if(sr.ok){ const sj = await sr.json(); if(sj[0]){ isOpen = sj[0].open; spamOn = sj[0].spam_schutz !== false; } }
  }catch(e){}
  updateOpenBtn();
  const newIds = knownIds ? rows.filter(x => !knownIds.has(x.id)).map(x => x.id) : [];
  knownIds = new Set(rows.map(x => x.id));
  if(newIds.length){ blink(); beep(); if(document.hidden) document.title = "● Neuer Wunsch"; }
  const norm = s => (s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  const key = w => norm(w.song) + "|" + norm(w.artist);
  const groups = new Map();
  rows.forEach(w => { const k = key(w); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(w); });
  const list = [...groups.values()];
  const open = list.filter(g => g.some(x => !x.done)).length;
  $("count").textContent = open + " Lieder offen, " + list.length + " Lieder, " + rows.length + " Wünsche";
  const ul = $("list"); ul.textContent = "";
  const q = norm($("search").value);
  let shown = hideDone ? list.filter(g => g.some(x => !x.done)) : list;
  if(q) shown = shown.filter(g => g.some(x => norm([x.song, x.artist, x.name].join(" ")).includes(q)));
  if(!shown.length){ const e = document.createElement("li"); e.textContent = q ? "Keine Treffer." : "Keine offenen Wünsche."; ul.append(e); }
  shown.forEach(g => {
    const w = g[0], n = g.length, done = g.every(x => x.done);
    const ids = "(" + g.map(x => x.id).join(",") + ")";
    const li = document.createElement("li"); li.className = (done ? "done " : "") + (n > 1 ? "dup" : "") + (g.some(x => newIds.includes(x.id)) ? " new" : "");
    const info = document.createElement("div");
    const t = document.createElement("div"); t.className = "t"; t.textContent = w.song + (w.artist ? " – " + w.artist : "");
    if(n > 1){ const b = document.createElement("span"); b.className = "badge"; b.textContent = n + "× gewünscht"; t.append(b); }
    const names = [...new Set(g.map(x => x.name).filter(Boolean))];
    const s = document.createElement("div"); s.className = "s";
    s.textContent = (names.length ? names.join(", ") : "anonym") + ", zuletzt " + new Date(w.created_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr";
    info.append(t, s);
    const act = document.createElement("div"); act.className = "act";
    const b1 = document.createElement("button"); b1.textContent = done ? "Wieder offen" : "Gespielt";
    b1.onclick = async () => { await fetch(base + "?id=in." + ids, {method:"PATCH", headers: hdr(token), body: JSON.stringify({done: !done})}); load(); };
    const b2 = document.createElement("button"); b2.className = "ghost"; b2.textContent = "Löschen";
    b2.onclick = async () => { await fetch(base + "?id=in." + ids, {method:"DELETE", headers: hdr(token)}); load(); };
    act.append(b1, b2); li.append(info, act); ul.append(li);
  });
}
</script>
</body>
</html>
