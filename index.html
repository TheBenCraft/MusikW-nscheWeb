<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff5d8f'/%3E%3Cellipse cx='38' cy='70' rx='15' ry='11' fill='%2314102b'/%3E%3Crect x='48' y='24' width='7' height='46' fill='%2314102b'/%3E%3Cpath d='M55 24q22 4 22 24-8-12-22-12z' fill='%2314102b'/%3E%3C/svg%3E">
<title>Musikwunsch</title>
<style>
:root{--bg:#14102b;--panel:#201a45;--text:#f3eefc;--muted:#a79fd0;--pink:#ff5d8f;--yellow:#ffd447;--line:#3a3270}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px}
h1{font-size:clamp(2.4rem,11vw,3.6rem);line-height:.95;margin:.2em 0 .3em;font-weight:800;letter-spacing:-.02em}
h1 span{display:inline-block;background:var(--pink);color:var(--bg);padding:0 .15em;transform:rotate(-2deg)}
p{color:var(--muted);line-height:1.5;margin:0 0 1.4em}
label{display:block;font-weight:700;margin:1em 0 .35em}
input{width:100%;font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:.75em .9em}
input:focus{outline:3px solid var(--yellow);outline-offset:1px;border-color:var(--yellow)}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:10px;padding:.8em 1.2em;background:var(--yellow);color:var(--bg)}
button:focus-visible{outline:3px solid var(--text);outline-offset:2px}
button.main{width:100%;margin-top:1.4em;font-size:1.1rem}
button.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);padding:.4em .8em;font-weight:700}
.msg{min-height:1.5em;margin-top:1em;font-weight:700}
.ok{color:var(--yellow)}.err{color:var(--pink)}
.hide{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:1em;color:var(--muted)}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
li{background:var(--panel);border-left:6px solid var(--pink);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
li.done{opacity:.45;border-left-color:var(--line)}
li.done .t{text-decoration:line-through}
.t{font-weight:800;font-size:1.1rem;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:.9rem}
li.dup{border-left-color:var(--yellow)}
.badge{display:inline-block;margin-left:.5em;padding:.05em .55em;border-radius:99px;background:var(--yellow);color:var(--bg);font-size:.8rem;font-weight:800;white-space:nowrap}
.act{display:flex;gap:6px;flex-shrink:0}
.bar{flex-wrap:wrap}
.bar span:last-child{display:flex;gap:6px;flex-wrap:wrap}
li{flex-wrap:wrap}
li > div:first-child{flex:1 1 200px}
#panel button{min-height:44px;padding:.6em 1em}
#panel .t{font-size:1.25rem}
button.paused{background:var(--pink);color:var(--bg);border-color:var(--pink)}
footer{margin-top:2.5em;font-size:.85rem;color:var(--muted)}
footer a{color:var(--muted)}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--yellow)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:no-preference){li.new{animation:flash 3s ease-out}h1 span{transition:transform .3s}h1:hover span{transform:rotate(2deg)}}
</style>
</head>
<body>
<main>

<section id="guest">
  <h1>Was soll <span>laufen?</span></h1>
  <p>Schreib deinen Musikwunsch auf. Der DJ sieht ihn sofort.</p>
  <div>
    <label for="song">Titel</label>
    <input id="song" maxlength="200" autocomplete="off">
    <label for="artist">Interpret</label>
    <input id="artist" maxlength="200" autocomplete="off">
    <label for="name">Dein Name (optional)</label>
    <input id="name" maxlength="60" autocomplete="off">
    <button class="main" id="send">Wunsch abschicken</button>
    <div class="msg" id="gmsg" role="status"></div>
  </div>
</section>

<section id="admin" class="hide">
  <h1>Wunsch<span>liste</span></h1>
  <div id="login">
    <label for="mail">E-Mail</label>
    <input id="mail" type="email" autocomplete="username">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="main" id="go">Anmelden</button>
    <div class="msg err" id="lmsg" role="status"></div>
  </div>
  <div id="panel" class="hide">
    <div class="bar"><span id="count"></span><span><button class="ghost" id="open">Wünsche pausieren</button> <button class="ghost" id="snd">Ton: an</button> <button class="ghost" id="reload">Aktualisieren</button> <button class="ghost" id="csv">Excel-Export</button> <button class="ghost" id="hide" aria-pressed="false">Gespielte ausblenden</button> <button class="ghost" id="out">Abmelden</button></span></div>
    <ul id="list"></ul>
  </div>
</section>

<footer><a href="impressum.html">Impressum</a> &nbsp; <a href="datenschutz.html">Datenschutz</a></footer>
</main>
<script>
// ===== Hier eintragen (Supabase: Project Settings > API) =====
const SUPABASE_URL = "https://yrewxcoulmmobpdjmzxb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyZXd4Y291bG1tb2JwZGptenhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDI2ODIsImV4cCI6MjEwODg3ODY4Mn0.ofJbAC4mw9gyxMWq5exFtkcXGtMCTRr1ByHNn_VbjOU";
// =============================================================

const $ = id => document.getElementById(id);
const base = SUPABASE_URL + "/rest/v1/wishes";
const hdr = tok => ({apikey: SUPABASE_KEY, Authorization: "Bearer " + (tok || SUPABASE_KEY), "Content-Type": "application/json"});
let token = null, timer = null, lastRows = [], hideDone = false;
let knownIds = null, soundOn = true, audioCtx = null, wakeLock = null, isOpen = true;

function route(){
  const isAdmin = location.hash === "#admin";
  $("guest").classList.toggle("hide", isAdmin);
  $("admin").classList.toggle("hide", !isAdmin);
}
addEventListener("hashchange", route); route();

// ---- Gäste ----
const COOLDOWN = 120; // Sekunden zwischen zwei Wünschen pro Gerät
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
function closedUI(){
  ["song","artist","name","send"].forEach(id => $(id).disabled = true);
  $("gmsg").className = "msg err"; $("gmsg").textContent = "Wünsche sind gerade pausiert.";
}
async function checkOpen(){
  try{
    const r = await fetch(SUPABASE_URL + "/rest/v1/settings?select=open&id=eq.1", {headers: hdr()});
    const j = await r.json();
    if(j[0] && j[0].open === false){ closedUI(); return false; }
  }catch(e){}
  return true;
}
checkOpen();
$("send").onclick = async () => {
  const song = $("song").value.trim(), artist = $("artist").value.trim(), name = $("name").value.trim();
  const m = $("gmsg");
  if(!song){ m.className = "msg err"; m.textContent = "Bitte gib einen Titel ein."; return; }
  const wait = Math.ceil(COOLDOWN - (Date.now() - Number(store.get("lastWish") || 0)) / 1000);
  if(wait > 0){ m.className = "msg err"; m.textContent = "Bitte warte noch " + wait + " Sekunden, bevor du den nächsten Wunsch abschickst."; return; }
  $("send").disabled = true;
  try{
    const r = await fetch(base, {method:"POST", headers:{...hdr(), Prefer:"return=minimal"}, body: JSON.stringify({song, artist: artist || null, name: name || null})});
    if(!r.ok){ if(!(await checkOpen())) return; throw 0; }
    store.set("lastWish", Date.now());
    $("song").value = $("artist").value = "";
    m.className = "msg ok"; m.textContent = "Wunsch ist angekommen. Danke!";
  }catch(e){ m.className = "msg err"; m.textContent = "Das hat nicht geklappt. Versuch es gleich noch einmal."; }
  $("send").disabled = false;
};

// ---- Admin ----
$("go").onclick = async () => {
  $("lmsg").textContent = "";
  try{
    const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {method:"POST", headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"}, body: JSON.stringify({email:$("mail").value.trim(), password:$("pw").value})});
    if(!r.ok) throw 0;
    token = (await r.json()).access_token;
    $("pw").value = "";
    $("login").classList.add("hide"); $("panel").classList.remove("hide");
    try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    requestWake(); load(); timer = setInterval(load, 8000);
  }catch(e){ $("lmsg").textContent = "Anmeldung fehlgeschlagen. Prüfe E-Mail und Passwort."; }
};
$("out").onclick = () => { token = null; clearInterval(timer); knownIds = null; try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; $("panel").classList.add("hide"); $("login").classList.remove("hide"); $("list").textContent = ""; };
$("reload").onclick = () => load();
$("hide").onclick = () => {
  hideDone = !hideDone;
  $("hide").textContent = hideDone ? "Gespielte einblenden" : "Gespielte ausblenden";
  $("hide").setAttribute("aria-pressed", hideDone);
  load();
};

$("csv").onclick = () => {
  const safe = v => { v = v == null ? "" : String(v); if(/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const head = ["Zeit","Titel","Interpret","Name","Gespielt"];
  const lines = lastRows.map(w => [new Date(w.created_at).toLocaleString("de-DE"), w.song, w.artist, w.name, w.done ? "ja" : "nein"].map(safe).join(";"));
  const blob = new Blob(["\ufeff" + [head.join(";"), ...lines].join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "musikwuensche.csv";
  document.body.append(a); a.click(); a.remove();
};

function beep(){
  if(!soundOn || !audioCtx) return;
  try{
    if(audioCtx.state === "suspended") audioCtx.resume();
    [880, 1175].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * .18;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.25, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      o.start(t); o.stop(t + .17);
    });
  }catch(e){}
}
$("snd").onclick = () => { soundOn = !soundOn; $("snd").textContent = "Ton: " + (soundOn ? "an" : "aus"); if(soundOn) beep(); };

function updateOpenBtn(){
  $("open").textContent = isOpen ? "Wünsche pausieren" : "Wünsche wieder annehmen";
  $("open").classList.toggle("paused", !isOpen);
}
$("open").onclick = async () => {
  await fetch(SUPABASE_URL + "/rest/v1/settings?id=eq.1", {method:"PATCH", headers: hdr(token), body: JSON.stringify({open: !isOpen})});
  load();
};

async function requestWake(){
  try{
    if(token && "wakeLock" in navigator && !(wakeLock && !wakeLock.released)) wakeLock = await navigator.wakeLock.request("screen");
  }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(!document.hidden){ document.title = "Musikwunsch"; requestWake(); } });

async function load(){
  const r = await fetch(base + "?select=*&order=created_at.desc", {headers: hdr(token)});
  if(!r.ok){ $("out").onclick(); $("lmsg").textContent = "Sitzung abgelaufen. Bitte neu anmelden."; return; }
  const rows = await r.json();
  lastRows = rows;
  try{
    const sr = await fetch(SUPABASE_URL + "/rest/v1/settings?select=open&id=eq.1", {headers: hdr(token)});
    if(sr.ok){ const sj = await sr.json(); if(sj[0]) isOpen = sj[0].open; }
  }catch(e){}
  updateOpenBtn();
  const newIds = knownIds ? rows.filter(x => !knownIds.has(x.id)).map(x => x.id) : [];
  knownIds = new Set(rows.map(x => x.id));
  if(newIds.length){ beep(); if(document.hidden) document.title = "● Neuer Wunsch"; }
  const norm = s => (s || "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  const key = w => norm(w.song) + "|" + norm(w.artist);
  const groups = new Map();
  rows.forEach(w => { const k = key(w); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(w); });
  const list = [...groups.values()];
  const open = list.filter(g => g.some(x => !x.done)).length;
  $("count").textContent = open + " Lieder offen, " + list.length + " Lieder, " + rows.length + " Wünsche";
  const ul = $("list"); ul.textContent = "";
  const shown = hideDone ? list.filter(g => g.some(x => !x.done)) : list;
  if(!shown.length){ const e = document.createElement("li"); e.textContent = "Keine offenen Wünsche."; ul.append(e); }
  shown.forEach(g => {
    const w = g[0], n = g.length, done = g.every(x => x.done);
    const ids = "(" + g.map(x => x.id).join(",") + ")";
    const li = document.createElement("li"); li.className = (done ? "done " : "") + (n > 1 ? "dup" : "") + (g.some(x => newIds.includes(x.id)) ? " new" : "");
    const info = document.createElement("div");
    const t = document.createElement("div"); t.className = "t"; t.textContent = w.song + (w.artist ? " – " + w.artist : "");
    if(n > 1){ const b = document.createElement("span"); b.className = "badge"; b.textContent = n + "× gewünscht"; t.append(b); }
    const names = [...new Set(g.map(x => x.name).filter(Boolean))];
    const s = document.createElement("div"); s.className = "s";
    s.textContent = (names.length ? names.join(", ") : "anonym") + ", zuletzt " + new Date(w.created_at).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr";
    info.append(t, s);
    const act = document.createElement("div"); act.className = "act";
    const b1 = document.createElement("button"); b1.textContent = done ? "Wieder offen" : "Gespielt";
    b1.onclick = async () => { await fetch(base + "?id=in." + ids, {method:"PATCH", headers: hdr(token), body: JSON.stringify({done: !done})}); load(); };
    const b2 = document.createElement("button"); b2.className = "ghost"; b2.textContent = "Löschen";
    b2.onclick = async () => { await fetch(base + "?id=in." + ids, {method:"DELETE", headers: hdr(token)}); load(); };
    act.append(b1, b2); li.append(info, act); ul.append(li);
  });
}
</script>
</body>
</html>
